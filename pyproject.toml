[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "colab-rich"
version = "0.1.0"
description = "Simple Rich output helpers for Google Colab and Python beginners"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0,<15.0",
    "ipywidgets>=7.6,<9.0",
]

[tool.setuptools.packages.find]
include = ["colab_rich*"]
